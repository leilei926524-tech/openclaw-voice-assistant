  #   build: ./web
  #   container_name: openclaw-web
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - openclaw-voice-assistant
  #   environment:
  #     - API_URL=http://openclaw-voice-assistant:8080
  #   networks:
  #     - openclaw-network

  # Database (future feature)
  # database:
  #   image: postgres:15-alpine
  #   container_name: openclaw-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=openclaw
  #     - POSTGRES_USER=openclaw
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-openclaw123}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - openclaw-network

networks:
  openclaw-network:
    driver: bridge

volumes:
  postgres_data:
  data:
  logs:
  config: