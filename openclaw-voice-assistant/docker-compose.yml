version: '3.8'

services:
  openclaw-voice-assistant:
    build: .
    container_name: openclaw-voice-assistant
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - XIAOMI_USERNAME=${XIAOMI_USERNAME:-}
      - XIAOMI_PASSWORD=${XIAOMI_PASSWORD:-}
      - XIAOMI_DEVICE_ID=${XIAOMI_DEVICE_ID:-}
      - TZ=Asia/Shanghai
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - openclaw-network

  # Web interface (future feature)
